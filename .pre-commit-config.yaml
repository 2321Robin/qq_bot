# Pre-commit hooks (S1-PRE-01..04).
# All remote hooks are pinned to immutable revisions; the local Gitleaks hook
# requires a Gitleaks binary installed on the developer machine (see README).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version installed by `pip install -e ".[dev]"`.
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Local staged-diff secret scan. CI additionally scans the full candidate
  # tree/history; the two checks are complementary, not interchangeable.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks staged diff scan
        entry: gitleaks git --pre-commit --redact --no-banner
        language: system
        pass_filenames: false
