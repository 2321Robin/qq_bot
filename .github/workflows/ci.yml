# Stage 1 CI gate (S1-CI-01..08, S1-GATE-02).
# Third-party actions are pinned to immutable commit SHAs; the comment keeps
# the human-readable version. Default permissions are read-only.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (pre-commit + Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install pinned Gitleaks binary for the local hook
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run pre-commit on all files
        run: python -m pre_commit run --all-files
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install CJK fonts for card rendering tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run tests
        run: python -m pytest -q
      - name: Coverage report with fail-under gate (3.11 only)
        if: matrix.python-version == '3.11'
        run: python -m pytest --cov=qq_bot --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Upload coverage XML artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  security:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download pinned Gitleaks binary
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Run redacted Gitleaks scan
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .

  container:
    name: Container build + compose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t qq-bot:ci .
      - name: Validate compose config
        run: docker compose config --quiet
      - name: Verify non-root image user
        run: |
          user="$(docker inspect --format '{{.Config.User}}' qq-bot:ci)"
          test -n "$user" && test "$user" != "root"
      - name: Smoke test health endpoints without private data
        run: |
          docker run -d --name qq-bot-smoke \
            -e HOST=0.0.0.0 -e PORT=8081 \
            -e CHAT_MEMORY_PATH=/tmp/smoke/chat_memory.sqlite3 \
            -p 8081:8081 qq-bot:ci
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = "1" || { docker logs qq-bot-smoke; exit 1; }
          curl -fsS http://127.0.0.1:8081/healthz
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/readyz >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1" || { docker logs qq-bot-smoke; exit 1; }
          curl -fsS http://127.0.0.1:8081/readyz
          docker rm -f qq-bot-smoke >/dev/null
